<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>ECharts</title>
    <style>
        html,
        body,
        #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
    <script src="qwebchannel.js"></script>
    <script src="echarts.min.js"></script>
</head>

<body>
    <div id="container"></div>
    <script>
        var chart = echarts.init(document.getElementById('container'));

        // 禁用浏览器默认右键菜单（WebEngine 层面策略失效时的兜底）
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            return false;
        }, { capture: true });

        // Handle window resize
        window.onresize = function () {
            chart.resize();
        };

        // Initialize WebChannel
        new QWebChannel(qt.webChannelTransport, function (channel) {
            window.bridge = channel.objects.bridge;
        });

        // API for Python
        function setOption(option) {
            chart.setOption(option);

            // Re-bind click event if needed
            chart.off('click');
            chart.on('click', function (params) {
                if (window.bridge) {
                    // 安全地提取数据，避免访问未定义的属性
                    var data = {};
                    
                    // 只提取存在的属性
                    if (params.componentType !== undefined) data.componentType = params.componentType;
                    if (params.seriesType !== undefined) data.seriesType = params.seriesType;
                    if (params.seriesName !== undefined) data.seriesName = params.seriesName;
                    if (params.name !== undefined) data.name = params.name;
                    if (params.dataIndex !== undefined) data.dataIndex = params.dataIndex;
                    if (params.data !== undefined) data.data = params.data;
                    if (params.value !== undefined) data.value = params.value;
                    
                    window.bridge.onChartClick(JSON.stringify(data));
                }
            });
        }

        function clear() {
            chart.clear();
        }

        function resize() {
            chart.resize();
        }
    </script>
</body>

</html>
